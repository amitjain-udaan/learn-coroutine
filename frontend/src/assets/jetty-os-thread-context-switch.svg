<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100" role="img" aria-labelledby="title desc">
  <title id="title">Threads, Jetty, JVM, and Kotlin coroutines mental model</title>
  <desc id="desc">A set of small diagrams explaining the hierarchy from coroutine to CPU, independent Jetty and coroutine thread pools, request suspension and resumption, different schedulers, and where context switching happens.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .app { fill: #ecfdf5; stroke: #86efac; }
      .coroutine { fill: #f5f3ff; stroke: #c4b5fd; }
      .dispatcher { fill: #fdf4ff; stroke: #f0abfc; }
      .jetty { fill: #eff6ff; stroke: #93c5fd; }
      .thread { fill: #fff7ed; stroke: #fdba74; }
      .cpu { fill: #fef2f2; stroke: #fca5a5; }
      .note { fill: #f0f9ff; stroke: #bae6fd; }
      .good { fill: #f0fdf4; stroke: #86efac; }
      .warn { fill: #fffbeb; stroke: #fcd34d; }
      .bad { fill: #fef2f2; stroke: #fca5a5; }
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 850; }
      .subtitle { font-size: 15px; fill: #475569; }
      .h2 { font-size: 23px; font-weight: 850; }
      .h3 { font-size: 16px; font-weight: 850; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 12px; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="2100"/>
  <text class="text title" x="52" y="58">Threads, Jetty, JVM, and Kotlin coroutines</text>
  <text class="text subtitle" x="52" y="86">Mental model based on the supplied findings: coroutines are tasks, dispatchers schedule them, Java threads map to OS threads, and CPUs execute OS threads.</text>

  <rect class="card" x="52" y="126" width="620" height="520" rx="18"/>
  <text class="text h2" x="88" y="168">1. Execution hierarchy</text>
  <text class="text subtitle" x="88" y="194">A coroutine cannot execute by itself. It needs a thread.</text>

  <rect class="card app" x="210" y="232" width="300" height="48" rx="10"/>
  <text class="text h3" x="300" y="262">Application code</text>
  <path class="arrow" d="M 360 280 L 360 324"/>

  <rect class="card coroutine" x="210" y="324" width="300" height="48" rx="10"/>
  <text class="text h3" x="302" y="354">Coroutine task</text>
  <path class="arrow" d="M 360 372 L 360 416"/>

  <rect class="card dispatcher" x="210" y="416" width="300" height="48" rx="10"/>
  <text class="text h3" x="276" y="446">Coroutine dispatcher</text>
  <path class="arrow" d="M 360 464 L 360 508"/>

  <rect class="card thread" x="210" y="508" width="300" height="48" rx="10"/>
  <text class="text h3" x="298" y="538">Java thread</text>
  <path class="arrow" d="M 360 556 L 360 600"/>

  <rect class="card thread" x="210" y="600" width="300" height="48" rx="10"/>
  <text class="text h3" x="304" y="630">OS thread</text>
  <path class="arrow" d="M 360 648 L 360 692"/>

  <rect class="card cpu" x="210" y="692" width="300" height="48" rx="10"/>
  <text class="text h3" x="338" y="722">CPU</text>

  <rect class="card" x="728" y="126" width="620" height="520" rx="18"/>
  <text class="text h2" x="764" y="168">2. Kotlin thread is Java thread</text>
  <text class="text subtitle" x="764" y="194">Kotlin has no special OS-level thread type.</text>

  <rect class="card coroutine" x="832" y="260" width="180" height="70" rx="12"/>
  <text class="text h3" x="870" y="290">Kotlin</text>
  <text class="text small" x="866" y="312">thread { ... }</text>
  <path class="arrow" d="M 1012 295 L 1072 295"/>

  <rect class="card thread" x="1072" y="260" width="180" height="70" rx="12"/>
  <text class="text h3" x="1110" y="290">Java Thread</text>
  <text class="text small" x="1108" y="312">JVM object</text>
  <path class="arrow" d="M 1162 330 L 1162 390"/>

  <rect class="card thread" x="1072" y="390" width="180" height="70" rx="12"/>
  <text class="text h3" x="1114" y="420">OS Thread</text>
  <text class="text small" x="1102" y="442">scheduled by OS</text>

  <rect class="card note" x="792" y="520" width="492" height="80" rx="12"/>
  <text class="text h3" x="820" y="552">Normally: 1 Java thread = 1 OS thread</text>
  <text class="text small" x="820" y="576">The JVM creates the Java thread. The OS schedules the backing OS thread.</text>

  <rect class="card" x="52" y="704" width="1296" height="420" rx="18"/>
  <text class="text h2" x="88" y="746">3. Independent thread pools inside the JVM</text>
  <text class="text subtitle" x="88" y="772">Jetty thread pool and coroutine dispatcher thread pools are different owners with different schedulers.</text>

  <rect class="card jetty" x="128" y="824" width="300" height="210" rx="14"/>
  <text class="text h3" x="164" y="860">Jetty Thread Pool</text>
  <text class="text small" x="164" y="884">Owned by Jetty</text>
  <rect class="card" x="164" y="920" width="90" height="42" rx="8"/>
  <text class="text small" x="184" y="946">Jetty-1</text>
  <rect class="card" x="270" y="920" width="90" height="42" rx="8"/>
  <text class="text small" x="290" y="946">Jetty-2</text>
  <rect class="card" x="164" y="974" width="90" height="42" rx="8"/>
  <text class="text small" x="184" y="1000">Jetty-3</text>
  <rect class="card" x="270" y="974" width="90" height="42" rx="8"/>
  <text class="text small" x="290" y="1000">Jetty-4</text>

  <rect class="card dispatcher" x="550" y="824" width="300" height="210" rx="14"/>
  <text class="text h3" x="586" y="860">Dispatchers.Default</text>
  <text class="text small" x="586" y="884">Owned by coroutines</text>
  <rect class="card" x="586" y="920" width="104" height="42" rx="8"/>
  <text class="text small" x="604" y="946">Default-1</text>
  <rect class="card" x="706" y="920" width="104" height="42" rx="8"/>
  <text class="text small" x="724" y="946">Default-2</text>
  <rect class="card" x="586" y="974" width="104" height="42" rx="8"/>
  <text class="text small" x="604" y="1000">Default-3</text>

  <rect class="card dispatcher" x="972" y="824" width="300" height="210" rx="14"/>
  <text class="text h3" x="1008" y="860">Dispatchers.IO</text>
  <text class="text small" x="1008" y="884">Owned by coroutines</text>
  <rect class="card" x="1008" y="920" width="82" height="42" rx="8"/>
  <text class="text small" x="1034" y="946">IO-1</text>
  <rect class="card" x="1104" y="920" width="82" height="42" rx="8"/>
  <text class="text small" x="1130" y="946">IO-2</text>
  <rect class="card" x="1198" y="920" width="82" height="42" rx="8"/>
  <text class="text small" x="1224" y="946">IO-3</text>
  <rect class="card" x="1008" y="974" width="82" height="42" rx="8"/>
  <text class="text small" x="1034" y="1000">IO-4</text>

  <path class="line" d="M 488 824 L 488 1034"/>
  <path class="line" d="M 910 824 L 910 1034"/>
  <text class="text h3" x="496" y="936">separate</text>
  <text class="text h3" x="918" y="936">separate</text>

  <rect class="card" x="52" y="1182" width="620" height="420" rx="18"/>
  <text class="text h2" x="88" y="1224">4. Who schedules what?</text>
  <text class="text subtitle" x="88" y="1250">Two different schedulers operate at different layers.</text>

  <rect class="card dispatcher" x="124" y="1302" width="210" height="78" rx="12"/>
  <text class="text h3" x="154" y="1334">Coroutine Dispatcher</text>
  <text class="text small" x="154" y="1358">schedules coroutines</text>
  <path class="arrow" d="M 334 1341 L 410 1341"/>
  <rect class="card thread" x="410" y="1302" width="210" height="78" rx="12"/>
  <text class="text h3" x="454" y="1334">Java Threads</text>
  <text class="text small" x="450" y="1358">Default / IO / custom</text>

  <rect class="card thread" x="124" y="1430" width="210" height="78" rx="12"/>
  <text class="text h3" x="168" y="1462">OS Scheduler</text>
  <text class="text small" x="158" y="1486">schedules OS threads</text>
  <path class="arrow" d="M 334 1469 L 410 1469"/>
  <rect class="card cpu" x="410" y="1430" width="210" height="78" rx="12"/>
  <text class="text h3" x="466" y="1462">CPU cores</text>
  <text class="text small" x="452" y="1486">hardware execution</text>

  <rect class="card" x="728" y="1182" width="620" height="420" rx="18"/>
  <text class="text h2" x="764" y="1224">5. Spring Boot suspend request flow</text>
  <text class="text subtitle" x="764" y="1250">A coroutine may start on Jetty and resume elsewhere after suspension.</text>

  <rect class="card jetty" x="796" y="1300" width="190" height="58" rx="10"/>
  <text class="text h3" x="830" y="1335">Jetty Thread-2</text>
  <path class="arrow" d="M 986 1329 L 1044 1329"/>
  <rect class="card app" x="1044" y="1300" width="190" height="58" rx="10"/>
  <text class="text h3" x="1082" y="1335">Controller starts</text>
  <path class="arrow" d="M 1139 1358 L 1139 1404"/>
  <rect class="card coroutine" x="1044" y="1404" width="190" height="58" rx="10"/>
  <text class="text h3" x="1092" y="1439">delay()</text>
  <path class="arrow" d="M 1044 1433 L 986 1433"/>
  <rect class="card good" x="796" y="1404" width="190" height="58" rx="10"/>
  <text class="text h3" x="822" y="1439">Jetty thread free</text>
  <path class="arrow dashed" d="M 891 1462 L 891 1510"/>
  <rect class="card dispatcher" x="796" y="1510" width="190" height="58" rx="10"/>
  <text class="text h3" x="834" y="1545">Dispatcher</text>
  <path class="arrow" d="M 986 1539 L 1044 1539"/>
  <rect class="card thread" x="1044" y="1510" width="190" height="58" rx="10"/>
  <text class="text h3" x="1080" y="1545">Default-2</text>

  <rect class="card" x="52" y="1660" width="1296" height="342" rx="18"/>
  <text class="text h2" x="88" y="1702">6. Context switching and cost</text>
  <text class="text subtitle" x="88" y="1728">Coroutine switching and OS context switching are not the same thing.</text>

  <rect class="card good" x="100" y="1780" width="360" height="118" rx="14"/>
  <text class="text h3" x="128" y="1814">Coroutine suspension</text>
  <text class="text small" x="128" y="1840">Runtime saves continuation state.</text>
  <text class="text small" x="128" y="1862">No kernel context switch is required just because a coroutine suspends.</text>

  <rect class="card warn" x="520" y="1780" width="360" height="118" rx="14"/>
  <text class="text h3" x="548" y="1814">Thread hop</text>
  <text class="text small" x="548" y="1840">Coroutine resumes on another Java thread.</text>
  <text class="text small" x="548" y="1862">There is dispatcher queueing and scheduling overhead.</text>

  <rect class="card bad" x="940" y="1780" width="360" height="118" rx="14"/>
  <text class="text h3" x="968" y="1814">OS context switch</text>
  <text class="text small" x="968" y="1840">OS saves/restores real OS thread state.</text>
  <text class="text small" x="968" y="1862">Often microseconds; repeated switches and cache misses are expensive.</text>

  <rect class="card note" x="100" y="1934" width="1200" height="42" rx="12"/>
  <text class="text h3" x="128" y="1961">Key rule: CPU executes OS threads only. Java threads map to OS threads. Coroutines are scheduled tasks, not CPU execution units.</text>
</svg>
